name: Promote Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to promote to'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
   

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Image Tag from DEV
        id: gettag
        run: |
          IMAGE=$(grep "image:" k8s/dev/deployment.yaml | awk '{print $2}')
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update Target Environment
        run: |
          sed -i "s|image:.*|image: $IMAGE|" k8s/${{ github.event.inputs.environment }}/deployment.yaml

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -b promote-${{ github.event.inputs.environment }}
          git add k8s/${{ github.event.inputs.environment }}/deployment.yaml
          git commit -m "Promote image to ${{ github.event.inputs.environment }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: promote-${{ github.event.inputs.environment }}
          base: main
          title: "Promote to ${{ github.event.inputs.environment }}"
          body: "Auto promotion from Dev to ${{ github.event.inputs.environment }}"
