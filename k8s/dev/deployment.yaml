apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: manasabreddy/devops-mansa-app:c880865be8426030ae3efbee9e18c469f4fe42c4
        ports:
        - containerPort: 5000
